# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "Freshdesk Ops Intelligence MCP"
slug: "freshdesk-ops-intelligence-mcp"

runtime: typescript

build:
  install: "npm install"
  command: "npm run build"

start:
  type: stdio
  command: "node dist/index.js"

credentials:
  - name: "FRESHDESK_DOMAIN"
    description: "Your Freshdesk subdomain (e.g. mycompany for mycompany.freshdesk.com)"
    docs_url: "https://support.freshdesk.com/en/support/solutions/articles/215517"
  - name: "FRESHDESK_API_KEY"
    description: "API key from Freshdesk Profile Settings → API Key"
    docs_url: "https://support.freshdesk.com/en/support/solutions/articles/215517"
